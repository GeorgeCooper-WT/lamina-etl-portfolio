name: ETL Pipeline CI

# 1. Action Trigger: Only run if files in the etl folder or if this YAML file change
on:
  push:
    branches:
      - main
    paths:
      - 'etl/**'
      - '.github/workflows/etl-pipeline.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'etl/**'
      - '.github/workflows/etl-pipeline.yml'

# 2. Action
jobs:
  test-and-build:
    runs-on: ubuntu-latest # GitHub free Linux machine

    steps:
      # Step 1: Download code into the Linux machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10" # Can use 3.9 or 3.11

      # Step 3: Check for fatal Python syntax errors
      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Run Black Formatting Check
        run: black --check ./etl

      - name: Run Syntax Check
        run: flake8 ./etl --count --select=E9,F63,F7,F82 --show-source --statistics

      # Step 4: Prove the Docker container builds correctly
      - name: Test Docker Build
        run: docker build -t lamina-etl:test ./etl